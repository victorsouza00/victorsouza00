name: Update 3D Contributions

on:
  schedule:
    - cron: '0 0 * * *'  # Executa diariamente
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        
      - name: Generate 3D Contributions
        uses: yoshi389111/github-profile-3d-contrib@v0.9.1
        with:
          USERNAME: victorsouza00
          THEME: "dark"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Changes
        run: |
          git config --global user.name "victorsouza00"
          git config --global user.email "seu-email@exemplo.com"
          git add .
          git commit -m "Update 3D contributions"
          git push
