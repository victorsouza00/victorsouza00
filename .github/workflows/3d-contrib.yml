name: GitHub-Profile-3D-Contrib

on:
  schedule: # Executa diariamente às 18:00 UTC (15:00 horário de Brasília)
    - cron: "0 12 * * *"
  workflow_dispatch:  # Permite acionar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-3d-contrib
    steps:
      - uses: actions/checkout@v4
      
      # Gera o gráfico 3D
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: victorsouza00  # Substitui a variável automática pelo seu username
          THEME: "dark"  # Adicionei tema personalizado (opcional)
          
      # Commit automático
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "Update 3D contributions"; then
            git push
          else
            echo "No changes to commit"
          fi
